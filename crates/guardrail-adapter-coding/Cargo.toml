[package]
name = "guardrail-adapter-coding"
version = "0.1.0"
edition = "2021"
description = "Coding adapter for Guardrail: AST reduction, patch engine, compiler verifier"

[dependencies]
guardrail-core = { path = "../guardrail-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
async-trait = "0.1"
tokio = { version = "1.0", features = ["process", "io-util", "fs"] }
regex = "1.10"
