[package]
name = "guardrail-server"
version = "0.1.0"
edition = "2021"
description = "Guardrail MCP server binary with rmcp stdio transport"

[dependencies]
guardrail-core = { path = "../guardrail-core" }
guardrail-adapter-coding = { path = "../guardrail-adapter-coding" }
rmcp = { version = "3.5", default-features = false, features = ["server", "transport-io", "client", "transport-child-process", "transport-async-rw", "elicitation"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1"
ureq = { version = "3", default-features = false, features = ["json"] }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = "2"

[dev-dependencies]
tempfile = "3"
